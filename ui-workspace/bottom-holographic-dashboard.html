<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RM Switch Deck HUD</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #191c22;
      --panel-2: #12151a;
      --line: #303642;
      --text: #e8edf2;
      --muted: #95a2b0;
      --cyan: #39d7ff;
      --green: #49e66f;
      --main: #ffd24a;
      --pink: #ff5fa2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.42 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 12px;
      padding: 14px;
    }

    .left {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .toolbar,
    .side {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .toolbar {
      min-height: 56px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
    }

    .title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .title strong {
      font-size: 15px;
      font-weight: 700;
    }

    .title span {
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    button,
    select,
    input[type="range"] {
      font: inherit;
    }

    button,
    select {
      min-height: 36px;
      border: 1px solid #414856;
      background: #20242c;
      color: var(--text);
      border-radius: 6px;
      padding: 8px 11px;
    }

    button {
      min-width: 74px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      border-color: #687486;
    }

    button.active {
      border-color: var(--cyan);
      box-shadow: inset 0 0 0 1px #2aaed0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--cyan);
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: #07080a;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: min(100%, calc((100vh - 104px) * 16 / 9));
      aspect-ratio: 16 / 9;
      display: block;
      background: #060709;
    }

    .side {
      min-width: 0;
      min-height: 0;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }

    .group {
      border: 1px solid #2b313b;
      background: var(--panel-2);
      border-radius: 8px;
      padding: 10px;
    }

    .group h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: #cdd6df;
    }

    .fields {
      display: grid;
      gap: 8px;
    }

    label,
    .status {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status strong {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .command-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 6px;
    }

    .command {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border: 1px solid #2c333e;
      border-radius: 6px;
      background: #171a20;
      color: #cbd5df;
      font-size: 12px;
    }

    .command code {
      color: #dce6ef;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .controls {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="left">
      <div class="toolbar">
        <div class="title">
          <strong>RM Switch Deck HUD</strong>
          <span>four-switch holographic perspective frame</span>
        </div>
        <div class="controls" role="group" aria-label="Dashboard presets">
          <button data-preset="legacy">24 Base</button>
          <button data-preset="fusion" class="active">Fusion</button>
          <button data-preset="combat">Combat</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="preview" width="1920" height="1080" aria-label="Bottom holographic dashboard preview"></canvas>
      </div>
    </section>

    <aside class="side">
      <section class="group">
        <h2>View</h2>
        <div class="fields">
          <label>
            Grid
            <select id="gridMode">
              <option value="axes" selected>Axes</option>
              <option value="full">Full</option>
              <option value="off">Off</option>
            </select>
          </label>
          <label>
            Mask
            <input id="maskToggle" type="checkbox" checked />
          </label>
          <div class="status">
            Reference
            <strong id="referenceStatus">24 + 25</strong>
          </div>
          <div class="status">
            Primitives
            <strong id="primitiveStatus">0 total</strong>
          </div>
        </div>
      </section>

      <section class="group">
        <h2>Signal</h2>
        <div class="fields">
          <label>
            Cap
            <input id="capSwitch" type="checkbox" checked />
          </label>
          <label>
            Turbo
            <input id="turboSwitch" type="checkbox" />
          </label>
          <label>
            Feeder
            <input id="feederSwitch" type="checkbox" checked />
          </label>
          <label>
            Spin
            <input id="spinSwitch" type="checkbox" />
          </label>
        </div>
      </section>

      <section class="group command-list" id="commandList" aria-label="Primitive groups"></section>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");
    const gridMode = document.getElementById("gridMode");
    const maskToggle = document.getElementById("maskToggle");
    const referenceStatus = document.getElementById("referenceStatus");
    const primitiveStatus = document.getElementById("primitiveStatus");
    const commandList = document.getElementById("commandList");
    const loadSlider = document.getElementById("loadSlider");
    const balanceSlider = document.getElementById("balanceSlider");
    const pulseSlider = document.getElementById("pulseSlider");
    const aimMode = document.getElementById("aimMode");
    const legState = document.getElementById("legState");
    const capSwitch = document.getElementById("capSwitch");
    const turboSwitch = document.getElementById("turboSwitch");
    const feederSwitch = document.getElementById("feederSwitch");
    const spinSwitch = document.getElementById("spinSwitch");

    const W = canvas.width;
    const H = canvas.height;
    const color = {
      cyan: "#39d7ff",
      main: "#ffd24a",
      yellow: "#f6e56b",
      white: "#e8edf2",
      green: "#49e66f",
      orange: "#ff9d3a",
      purple: "#b077ff",
      pink: "#ff5fa2",
      black: "#000000",
      del: "#000000",
    };
    const previewColor = {
      maskFill: "#2d2d2d",
      maskStroke: "#686868",
    };

    const legWidget = {
      cx: 960,
      cy: 174,
      scale: 0.48,
      phase: 0,
    };

    const clientMaskRects = [
      { id: "TOP", x: 0, y: 925, w: 1920, h: 155 },
      { id: "LEFT_MAIN", x: 0, y: 0, w: 422, h: 516 },
      { id: "LEFT_STEP", x: 422, y: 0, w: 82, h: 258 },
      { id: "LEFT_FLOAT", x: 473, y: 478, w: 92, h: 122 },
      { id: "RIGHT_FLOAT", x: 1357, y: 478, w: 92, h: 122 },
      { id: "RIGHT_MAIN", x: 1461, y: 0, w: 459, h: 333 },
    ];

    let commands = [];
    let preset = new URLSearchParams(location.search).get("preset") ?? "fusion";
    let lastFrameTime = 0;

    function by(y) {
      return H - y;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(Number(value) || 0, min), max);
    }

    function rectToCanvas(rect) {
      return { x: rect.x, y: H - rect.y - rect.h, w: rect.w, h: rect.h };
    }

    function intersects(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function track(name, type, layer, colorValue, width, args, scope = "STATIC") {
      commands.push({ name, type, layer, color: colorValue, width, args, scope });
    }

    function drawLine(name, x1, y1, x2, y2, stroke = color.cyan, width = 2, layer = 0, scope = "STATIC") {
      ctx.save();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(x1, by(y1));
      ctx.lineTo(x2, by(y2));
      ctx.stroke();
      ctx.restore();
      track(name, "Line", layer, stroke, width, { x1, y1, x2, y2 }, scope);
    }

    function drawArc(name, x, y, r, startDeg, endDeg, stroke = color.cyan, width = 2, layer = 0, scope = "STATIC") {
      drawEllipseArc(name, x, y, r, r, startDeg, endDeg, stroke, width, layer, scope);
    }

    function drawEllipseArc(
      name,
      x,
      y,
      rx,
      ry,
      startDeg,
      endDeg,
      stroke = color.cyan,
      width = 2,
      layer = 0,
      scope = "STATIC",
    ) {
      ctx.save();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      const start = (-endDeg * Math.PI) / 180;
      const end = (-startDeg * Math.PI) / 180;
      ctx.ellipse(x, by(y), rx, ry, 0, start, end);
      ctx.stroke();
      ctx.restore();
      track(name, "Arc", layer, stroke, width, { x, y, rx, ry, startDeg, endDeg }, scope);
    }

    function ellipsePoint(x, y, rx, ry, deg) {
      const rad = (deg * Math.PI) / 180;
      return {
        x: x + Math.cos(rad) * rx,
        y: y + Math.sin(rad) * ry,
      };
    }

    function drawCircle(name, x, y, r, stroke = color.cyan, width = 2, layer = 0, scope = "STATIC") {
      ctx.save();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.arc(x, by(y), r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      track(name, "Circle", layer, stroke, width, { x, y, r }, scope);
    }

    function drawText(name, value, x, y, size, stroke = color.white, layer = 1, scope = "STATIC") {
      ctx.save();
      ctx.fillStyle = stroke;
      ctx.font = `700 ${size}px 'Cascadia Mono', Consolas, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(value), x, by(y));
      ctx.restore();
      track(name, "Text", layer, stroke, 1, { x, y, value, size }, scope);
    }

    function drawGrid() {
      if (gridMode.value === "off") return;

      ctx.save();
      if (gridMode.value === "full") {
        ctx.strokeStyle = "#15171c";
        ctx.lineWidth = 1;
        for (let x = 0; x <= W; x += 120) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = 0; y <= H; y += 90) {
          ctx.beginPath();
          ctx.moveTo(0, by(y));
          ctx.lineTo(W, by(y));
          ctx.stroke();
        }
      }

      ctx.strokeStyle = "#238aa3";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(72, by(72));
      ctx.lineTo(220, by(72));
      ctx.moveTo(72, by(72));
      ctx.lineTo(72, by(220));
      ctx.stroke();
      ctx.restore();
    }

    function drawForbiddenPreview() {
      if (!maskToggle.checked) return;
      clientMaskRects.forEach((rect) => {
        const cr = rectToCanvas(rect);
        ctx.fillStyle = previewColor.maskFill;
        ctx.fillRect(cr.x, cr.y, cr.w, cr.h);
        ctx.strokeStyle = previewColor.maskStroke;
        ctx.lineWidth = 2;
        ctx.strokeRect(cr.x, cr.y, cr.w, cr.h);
      });
    }

    function drawPerspectiveEdge() {
      const edge = color.cyan;
      const secondary = color.white;

      drawLine("E00", 520, 72, 690, 146, edge, 4);
      drawLine("E01", 690, 146, 825, 178, edge, 3);
      drawLine("E02", 1095, 178, 1230, 146, edge, 3);
      drawLine("E03", 1230, 146, 1400, 72, edge, 4);
      drawLine("E04", 600, 94, 740, 150, secondary, 1);
      drawLine("E05", 740, 150, 860, 178, secondary, 1);
      drawLine("E06", 1060, 178, 1180, 150, secondary, 1);
      drawLine("E07", 1180, 150, 1320, 94, secondary, 1);
      drawLine("E08", 690, 146, 900, 332, secondary, 1);
      drawLine("E09", 1230, 146, 1020, 332, secondary, 1);
      drawLine("E10", 825, 178, 935, 300, secondary, 1);
      drawLine("E11", 1095, 178, 985, 300, secondary, 1);
      drawLine("E12", 520, 72, 546, 130, secondary, 2);
      drawLine("E13", 1400, 72, 1374, 130, secondary, 2);
      drawLine("E14", 690, 96, 810, 112, secondary, 1);
      drawLine("E15", 1110, 112, 1230, 96, secondary, 1);
    }

    function drawCentralGauge() {
      const cx = 960;
      const cy = 134;
      const rx = 205;
      const ry = 96;
      const load = clamp(loadSlider.value, 0, 1);
      const sweep = 142 * load;
      const main = load > 0.78 ? color.pink : load > 0.54 ? color.main : color.green;

      drawEllipseArc("G00", cx, cy, rx, ry, 18, 162, color.white, 9, 1);
      drawEllipseArc("G01", cx, cy, rx, ry, 18, 18 + sweep, main, 12, 2, "DYNAMIC");
      drawEllipseArc("G02", cx, cy, rx + 22, ry + 10, 22, 158, color.cyan, 2, 1);
      drawEllipseArc("G03", cx, cy, rx - 56, ry - 28, 28, 152, color.white, 2, 1);

      for (let i = 0; i <= 10; i++) {
        const deg = 22 + i * 13.6;
        const outer = ellipsePoint(cx, cy, rx + 10, ry + 4, deg);
        const inner = ellipsePoint(cx, cy, rx - (i % 2 ? 8 : 22), ry - (i % 2 ? 3 : 10), deg);
        drawLine(`GT${i}`, inner.x, inner.y, outer.x, outer.y, color.white, i % 2 ? 1 : 2, 2);
      }

      const needleDeg = 18 + sweep;
      const needle = ellipsePoint(cx, cy, 138, 64, needleDeg);
      drawLine("GN0", cx, cy, needle.x, needle.y, main, 5, 3, "DYNAMIC");
      drawCircle("GN1", cx, cy, 10, color.white, 3, 3);
      drawLine("GB0", cx - 86, cy - 26, cx - 24, cy - 26, color.white, 2, 2);
      drawLine("GB1", cx + 24, cy - 26, cx + 86, cy - 26, color.white, 2, 2);
    }

    function drawSideDial(prefix, cx, cy, flip) {
      const balance = clamp(balanceSlider.value, -1, 1);
      const pulse = clamp(pulseSlider.value, 0, 1);
      const accent = prefix === "L" ? color.main : color.green;
      const activeSweep = 52 + 104 * (prefix === "L" ? (balance + 1) * 0.5 : pulse);

      drawCircle(`${prefix}D0`, cx, cy, 58, color.white, 2, 1);
      drawArc(`${prefix}D1`, cx, cy, 58, flip ? 210 : -30, flip ? 210 + activeSweep : -30 + activeSweep, accent, 5, 2, "DYNAMIC");
      drawCircle(`${prefix}D2`, cx, cy, 34, color.cyan, 1, 1);
      drawLine(`${prefix}D3`, cx - 18, cy, cx + 18, cy, color.white, 2, 2);
      drawLine(`${prefix}D4`, cx, cy - 18, cx, cy + 18, color.white, 2, 2);
      drawLine(`${prefix}D5`, cx + flip * 30, cy + 42, cx + flip * 86, cy + 78, accent, 2, 2);
      drawLine(`${prefix}D6`, cx + flip * 86, cy + 78, cx + flip * 138, cy + 74, color.white, 1, 2);
    }

    function drawHoloModules() {
      const moduleColor = color.cyan;
      drawLine("M00", 598, 262, 674, 286, moduleColor, 2, 2);
      drawLine("M01", 674, 286, 720, 260, moduleColor, 2, 2);
      drawLine("M02", 598, 262, 646, 236, color.white, 1, 2);
      drawLine("M03", 646, 236, 720, 260, color.white, 1, 2);
      drawLine("M04", 1220, 260, 1266, 286, moduleColor, 2, 2);
      drawLine("M05", 1266, 286, 1342, 262, moduleColor, 2, 2);
      drawLine("M06", 1220, 260, 1294, 236, color.white, 1, 2);
      drawLine("M07", 1294, 236, 1342, 262, color.white, 1, 2);
      drawLine("M08", 912, 288, 1008, 288, color.main, 2, 2);
      drawLine("M09", 930, 314, 990, 314, color.white, 1, 2);
      drawLine("M10", 948, 338, 972, 338, color.cyan, 1, 2);
    }

    const switchModules = [
      { id: "SWC", x: 612, y: 98, r: -12, scale: 0.78, on: () => capSwitch.checked, icon: drawCapSwitchIcon },
      { id: "SWT", x: 760, y: 134, r: -7, scale: 0.9, on: () => turboSwitch.checked, icon: drawTurboSwitchIcon },
      { id: "SWF", x: 1160, y: 134, r: 7, scale: 0.9, on: () => feederSwitch.checked, icon: drawFeederSwitchIcon },
      { id: "SWS", x: 1308, y: 98, r: 12, scale: 0.78, on: () => spinSwitch.checked, icon: drawSpinSwitchIcon },
    ];

    function switchPoint(module, x, y) {
      const scale = module.scale ?? 1;
      const rad = (module.r * Math.PI) / 180;
      const px = x * scale;
      const py = y * scale;
      return {
        x: module.x + Math.cos(rad) * px - Math.sin(rad) * py,
        y: module.y + Math.sin(rad) * px + Math.cos(rad) * py,
      };
    }

    function switchLine(module, suffix, x1, y1, x2, y2, stroke, width = 2, layer = 3, scope = "STATIC") {
      const start = switchPoint(module, x1, y1);
      const end = switchPoint(module, x2, y2);
      drawLine(`${module.id}${suffix}`, start.x, start.y, end.x, end.y, stroke, width, layer, scope);
    }

    function switchCircle(module, suffix, x, y, radius, stroke, width = 2, layer = 3, scope = "STATIC") {
      const center = switchPoint(module, x, y);
      const scale = module.scale ?? 1;
      drawCircle(`${module.id}${suffix}`, center.x, center.y, radius * scale, stroke, width * scale, layer, scope);
    }

    function switchArc(module, suffix, x, y, radius, startDeg, endDeg, stroke, width = 2, layer = 3, scope = "STATIC") {
      const center = switchPoint(module, x, y);
      const scale = module.scale ?? 1;
      drawArc(`${module.id}${suffix}`, center.x, center.y, radius * scale, startDeg + module.r, endDeg + module.r, stroke, width * scale, layer, scope);
    }

    function drawHudBalanceFrame() {
      drawLine("F00", 520, 58, 650, 84, color.cyan, 3, 1);
      drawLine("F01", 690, 92, 848, 128, color.cyan, 3, 1);
      drawLine("F02", 588, 124, 666, 142, color.white, 2, 1);
      drawLine("F03", 720, 154, 852, 184, color.white, 2, 1);
      drawLine("F04", 520, 58, 576, 112, color.white, 1, 0);
      drawLine("F05", 656, 86, 684, 146, color.white, 1, 0);
      drawLine("F06", 790, 116, 810, 174, color.white, 1, 0);

      drawLine("F07", 1400, 58, 1270, 84, color.cyan, 3, 1);
      drawLine("F08", 1230, 92, 1072, 128, color.cyan, 3, 1);
      drawLine("F09", 1332, 124, 1254, 142, color.white, 2, 1);
      drawLine("F10", 1200, 154, 1068, 184, color.white, 2, 1);
      drawLine("F11", 1400, 58, 1344, 112, color.white, 1, 0);
      drawLine("F12", 1264, 86, 1236, 146, color.white, 1, 0);
      drawLine("F13", 1130, 116, 1110, 174, color.white, 1, 0);

      drawLine("F14", 850, 92, 878, 176, color.cyan, 3, 1);
      drawLine("F15", 878, 176, 918, 220, color.cyan, 3, 1);
      drawLine("F16", 918, 220, 950, 220, color.cyan, 3, 1);
      drawLine("F17", 970, 220, 1002, 220, color.cyan, 3, 1);
      drawLine("F18", 1002, 220, 1042, 176, color.cyan, 3, 1);
      drawLine("F19", 1042, 176, 1070, 92, color.cyan, 3, 1);
      drawLine("F20", 904, 48, 940, 70, color.white, 2, 1);
      drawLine("F21", 980, 70, 1016, 48, color.white, 2, 1);
      drawLine("F22", 850, 92, 820, 122, color.cyan, 2, 1);
      drawLine("F23", 1070, 92, 1100, 122, color.cyan, 2, 1);
    }

    function drawSwitchDepth(module, on) {
      const edge = on ? color.cyan : color.white;
      switchLine(module, "P0", -58, -31, 58, -31, edge, on ? 2 : 1, 1);
      switchLine(module, "P1", -58, -22, -58, -31, color.white, 1, 1);
      switchLine(module, "P2", 58, -22, 58, -31, color.white, 1, 1);
    }

    function drawSwitchDeck() {
      switchModules.forEach((module) => {
        const on = module.on();
        const active = on ? color.main : color.white;
        const rail = on ? color.main : color.white;
        const fill = color.white;

        switchLine(module, "B0", -58, -22, -42, 22, rail, on ? 3 : 2, 2);
        switchLine(module, "B1", -42, 22, -12, 22, rail, on ? 3 : 2, 2);
        switchLine(module, "B2", 12, 22, 42, 22, rail, on ? 3 : 2, 2);
        switchLine(module, "B3", 42, 22, 58, -22, rail, on ? 3 : 2, 2);
        switchLine(module, "B4", -58, -22, -24, -22, color.white, 1, 2);
        switchLine(module, "B5", 24, -22, 58, -22, color.white, 1, 2);
        switchCircle(module, "C0", 0, 0, on ? 24 : 20, active, on ? 4 : 2, 3, "DYNAMIC");
        switchCircle(module, "C1", 0, 0, 5, fill, 2, 4, "DYNAMIC");
        module.icon(module, on, active, fill);
      });
    }

    function centralLegLocal(x, y) {
      return {
        x: legWidget.cx + x * legWidget.scale,
        y: legWidget.cy + y * legWidget.scale,
      };
    }

    function drawCentralLegInstrument() {
      const scale = legWidget.scale;
      const upperLink = 105 * scale;
      const lowerLink = 125 * scale;
      const distanceMinRatio = 95 / 105;
      const distanceMidRatio = 135 / 105;
      const distanceMaxRatio = 175 / 105;
      const distanceAmpRatio = (distanceMaxRatio - distanceMinRatio) * 0.5;
      const legs = [
        { id: "CL", color: color.cyan, phase: 0, hipOffset: -6 },
        { id: "CR", color: color.orange, phase: Math.PI, hipOffset: 6 },
      ];

      const hullSegments = [
        ["CG0", -78, -20, -68, 18, color.cyan],
        ["CG1", -68, 18, -42, 32, color.cyan],
        ["CG2", -42, 32, -8, 32, color.cyan],
        ["CG3", 8, 32, 46, 32, color.orange],
        ["CG4", 46, 32, 74, 14, color.orange],
        ["CG5", 74, 14, 78, -10, color.orange],
        ["CG6", 78, -10, 54, -24, color.orange],
        ["CG7", 54, -24, 8, -24, color.orange],
        ["CG8", -8, -24, -56, -24, color.cyan],
        ["CG9", -56, -24, -78, -20, color.cyan],
      ];
      hullSegments.forEach(([name, x1, y1, x2, y2, stroke]) => {
        const start = centralLegLocal(x1, y1);
        const end = centralLegLocal(x2, y2);
        drawLine(name, start.x, start.y, end.x, end.y, stroke, 2, 2);
      });

      const deckA = centralLegLocal(-54, 18);
      const deckLeft = centralLegLocal(-6, 18);
      const deckRight = centralLegLocal(6, 18);
      const deckB = centralLegLocal(48, 18);
      const hipCenter = centralLegLocal(0, 0);
      drawLine("CG10", deckA.x, deckA.y, deckLeft.x, deckLeft.y, color.cyan, 1, 2);
      drawLine("CG11", deckRight.x, deckRight.y, deckB.x, deckB.y, color.orange, 1, 2);
      drawCircle("CG12", hipCenter.x, hipCenter.y, 4, color.white, 2, 2);
      [distanceMinRatio, distanceMidRatio, distanceMaxRatio].forEach((distanceRatio, index) => {
        const tickY = legWidget.cy - distanceRatio * upperLink;
        const tickColor = index === 1 ? color.cyan : color.white;
        drawLine(`CGT${index}`, legWidget.cx - 48 * scale, tickY, legWidget.cx - 28 * scale, tickY, tickColor, 1, 1);
      });

      legs.forEach((leg) => {
        const wave = Math.sin(legWidget.phase + leg.phase);
        const angleWave = Math.sin(legWidget.phase + leg.phase + Math.PI / 3);
        const hipWheelDistanceRatio = distanceMidRatio + distanceAmpRatio * wave;
        const hipWheelAngleDeg = 90 + 10 * angleWave;
        const hipWheelAngleRad = (hipWheelAngleDeg * Math.PI) / 180;
        const hip = centralLegLocal(leg.hipOffset, 0);
        const distance = hipWheelDistanceRatio * upperLink;
        const minDistance = Math.abs(lowerLink - upperLink) + 1;
        const clampedDistance = Math.max(minDistance, Math.min(distance, upperLink + lowerLink - 1));
        const wheel = {
          x: hip.x + Math.cos(hipWheelAngleRad) * clampedDistance,
          y: hip.y - Math.sin(hipWheelAngleRad) * clampedDistance,
        };
        const hipToWheelX = wheel.x - hip.x;
        const hipToWheelY = wheel.y - hip.y;
        const centerDistance = Math.hypot(hipToWheelX, hipToWheelY) || clampedDistance;
        const dirX = hipToWheelX / centerDistance;
        const dirY = hipToWheelY / centerDistance;
        const along =
          (upperLink * upperLink + centerDistance * centerDistance - lowerLink * lowerLink) /
          (2 * centerDistance);
        const height = Math.sqrt(Math.max(0, upperLink * upperLink - along * along));
        const base = { x: hip.x + dirX * along, y: hip.y + dirY * along };
        const knee = { x: base.x - dirY * height, y: base.y + dirX * height };

        drawLine(`${leg.id}0`, hip.x, hip.y, knee.x, knee.y, leg.color, 4, 3, "DYNAMIC");
        drawLine(`${leg.id}1`, knee.x, knee.y, wheel.x, wheel.y, leg.color, 4, 3, "DYNAMIC");
        drawCircle(`${leg.id}2`, knee.x, knee.y, 4, leg.color, 2, 4, "DYNAMIC");
        drawCircle(`${leg.id}3`, wheel.x, wheel.y, 9, leg.color, 3, 4, "DYNAMIC");
        drawCircle(`${leg.id}4`, wheel.x, wheel.y, 3, color.white, 2, 4, "DYNAMIC");
      });
    }

    function aimPatternPoint(mode, x, y) {
      const s = mode.size ?? 1;
      const rad = ((mode.rot ?? 0) * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const dx = x - (mode.anchorX ?? 0);
      const dy = y - (mode.anchorY ?? 0);
      return {
        x: mode.x + (dx * cos - dy * sin) * s,
        y: mode.y + (dx * sin + dy * cos) * s,
      };
    }

    function aimPatternLine(mode, suffix, x1, y1, x2, y2, stroke, width = 3) {
      const start = aimPatternPoint(mode, x1, y1);
      const end = aimPatternPoint(mode, x2, y2);
      drawLine(`${mode.id}${suffix}`, start.x, start.y, end.x, end.y, stroke, width * (mode.size ?? 1), 3, "DYNAMIC");
    }

    function aimPatternCircle(mode, suffix, x, y, radius, stroke, width = 3) {
      const center = aimPatternPoint(mode, x, y);
      drawCircle(`${mode.id}${suffix}`, center.x, center.y, radius * (mode.size ?? 1), stroke, width * (mode.size ?? 1), 3, "DYNAMIC");
    }

    function aimPatternArc(mode, suffix, x, y, radius, startDeg, endDeg, stroke, width = 3) {
      const center = aimPatternPoint(mode, x, y);
      drawArc(
        `${mode.id}${suffix}`,
        center.x,
        center.y,
        radius * (mode.size ?? 1),
        startDeg + (mode.rot ?? 0),
        endDeg + (mode.rot ?? 0),
        stroke,
        width * (mode.size ?? 1),
        3,
        "DYNAMIC",
      );
    }

    function aimPatternRay(mode, suffix, innerRadius, outerRadius, deg, stroke, width = 2) {
      const rad = (deg * Math.PI) / 180;
      aimPatternLine(
        mode,
        suffix,
        Math.cos(rad) * innerRadius,
        Math.sin(rad) * innerRadius,
        Math.cos(rad) * outerRadius,
        Math.sin(rad) * outerRadius,
        stroke,
        width,
      );
    }

    function aimPatternMain(active) {
      return active ? color.main : color.white;
    }

    function aimPatternDetail(active) {
      return color.white;
    }

    function drawVehicleAimPattern(mode, active) {
      const main = aimPatternMain(active);
      const detail = aimPatternDetail(active);
      aimPatternLine(mode, "V0", -14, 0, 14, 0, main, 2);
      aimPatternLine(mode, "V1", 0, -14, 0, 14, detail, 2);
      aimPatternLine(mode, "V2", -10, 10, -5, 15, main, 2);
      aimPatternLine(mode, "V3", 10, 10, 5, 15, main, 2);
      aimPatternCircle(mode, "VC", 0, 0, 4, main, 2);
    }

    function drawAimFanPattern(mode, active, phaseDeg, suffix) {
      const main = aimPatternMain(active);
      for (let i = 0; i < 5; i++) {
        aimPatternRay(mode, `${suffix}${i}`, 6, 15, phaseDeg + i * 72, main, 3);
      }
      aimPatternCircle(mode, `${suffix}C`, 0, 0, 5, aimPatternDetail(active), 2);
    }

    function drawEnergyStaticAimPattern(mode, active) {
      drawAimFanPattern(mode, active, -90, "F");
      aimPatternLine(mode, "B0", -11, -29, 11, -29, aimPatternMain(active), 3);
    }

    function drawEnergySweepAimPattern(mode, active) {
      const main = aimPatternMain(active);
      drawAimFanPattern(mode, active, -54, "F");
      aimPatternArc(mode, "R0", 0, 0, 23, 22, 118, main, 2);
      aimPatternLine(mode, "A0", 18, 9, 23, 14, main, 2);
    }

    function drawOutpostAimPattern(mode, active) {
      const main = aimPatternMain(active);
      const detail = aimPatternDetail(active);
      const mainWidth = active ? 6 : 3;
      const coreWidth = active ? 4 : 2;
      aimPatternLine(mode, "L0", -13, 11, 0, 18, main, mainWidth);
      aimPatternLine(mode, "L1", 0, 18, 13, 11, main, mainWidth);
      aimPatternLine(mode, "L2", 0, 14, 0, -16, detail, 3);
      aimPatternLine(mode, "L3", -15, -18, 15, -18, main, mainWidth);
      aimPatternLine(mode, "L4", -8, 2, 8, 2, detail, 2);
      aimPatternCircle(mode, "C0", 0, 2, 5, main, coreWidth);
    }

    function drawLegLengthBottomLeft() {
      const scale = 0.6;
      const sc = (value) => value * scale;
      const selected = Number(legState.value);
      const upperLink = sc(105);
      const lowerLink = sc(125);
      const hip = { x: 590, y: 222 };
      const side = -1;
      const states = [
        { distanceRatio: 95 / 105, angleDeg: 16, accent: color.green },
        { distanceRatio: 135 / 105, angleDeg: 30, accent: color.main },
        { distanceRatio: 175 / 105, angleDeg: 44, accent: color.pink },
      ];
      const state = states[selected] ?? states[1];
      const distance = state.distanceRatio * upperLink;
      const angleRad = (state.angleDeg * Math.PI) / 180;
      const knee = { x: hip.x + Math.abs(Math.cos(angleRad)) * upperLink * side, y: hip.y - Math.sin(angleRad) * upperLink };
      const hipToKneeX = knee.x - hip.x;
      const hipToKneeY = knee.y - hip.y;
      const centerDistance = Math.hypot(hipToKneeX, hipToKneeY) || upperLink;
      const dirX = hipToKneeX / centerDistance;
      const dirY = hipToKneeY / centerDistance;
      const along =
        (distance * distance + centerDistance * centerDistance - lowerLink * lowerLink) /
        (2 * centerDistance);
      const height = Math.sqrt(Math.max(0, distance * distance - along * along));
      const base = { x: hip.x + dirX * along, y: hip.y + dirY * along };
      const wheelA = { x: base.x - dirY * height, y: base.y + dirX * height };
      const wheelB = { x: base.x + dirY * height, y: base.y - dirX * height };
      const wheel = wheelA.y < wheelB.y ? wheelA : wheelB;
      const local = (x, y) => ({ x: hip.x + sc(x), y: hip.y + sc(y) });

      const hull = [
        [-78, -20],
        [-68, 18],
        [-42, 32],
        [46, 32],
        [74, 14],
        [78, -10],
        [54, -24],
        [-56, -24],
      ].map(([x, y]) => local(x, y));
      hull.forEach((point, index) => {
        const next = hull[(index + 1) % hull.length];
        drawLine(`WL0${index}`, point.x, point.y, next.x, next.y, color.white, 3, 2);
      });

      const deckA = local(-54, 18);
      const deckB = local(48, 18);
      drawLine("WL08", deckA.x, deckA.y, deckB.x, deckB.y, color.white, 2, 2);
      drawCircle("WL09", hip.x, hip.y, sc(9), color.white, 3, 3);

      states.forEach((item, index) => {
        const y = hip.y - item.distanceRatio * upperLink;
        const tickColor = index === selected ? color.main : color.white;
        const tickEnd = hip.x + sc(index === selected ? 54 : 46);
        drawLine(`WL1${index}`, hip.x + sc(28), y, tickEnd, y, tickColor, index === selected ? 3 : 2, 2);
      });

      drawLine("WL20", hip.x, hip.y, knee.x, knee.y, color.white, 6, 3, "DYNAMIC");
      drawLine("WL21", knee.x, knee.y, wheel.x, wheel.y, state.accent, 6, 3, "DYNAMIC");
      drawCircle("WL22", knee.x, knee.y, sc(7), state.accent, 3, 3, "DYNAMIC");
      drawCircle("WL23", wheel.x, wheel.y, sc(20), color.white, 4, 3, "DYNAMIC");
      drawCircle("WL24", wheel.x, wheel.y, sc(5), color.white, 2, 4, "DYNAMIC");
    }

    function drawCompactCapArc() {
      const cx = 960;
      const cy = 292;
      const load = clamp(loadSlider.value, 0, 1);
      const span = 14 + load * 58;
      const stroke = load > 0.78 ? color.pink : load > 0.54 ? color.main : color.green;
      drawEllipseArc("C00", cx, cy, 250, 78, 138, 222, color.white, 7, 2);
      drawEllipseArc("C01", cx, cy, 250, 78, 180 - span, 180 - 8, stroke, 8, 3, "DYNAMIC");
      drawEllipseArc("C02", cx, cy, 250, 78, 180 + 8, 180 + span, stroke, 8, 3, "DYNAMIC");
      [0.25, 0.5, 0.75, 1].forEach((ratio, index) => {
        const deg = 180 - ratio * 58;
        const leftInner = ellipsePoint(cx, cy, 226, 68, deg);
        const leftOuter = ellipsePoint(cx, cy, 252, 78, deg);
        const rightInner = ellipsePoint(cx, cy, 226, 68, 360 - deg);
        const rightOuter = ellipsePoint(cx, cy, 252, 78, 360 - deg);
        drawLine(`C${index + 3}L`, leftInner.x, leftInner.y, leftOuter.x, leftOuter.y, color.white, 2, 2);
        drawLine(`C${index + 3}R`, rightInner.x, rightInner.y, rightOuter.x, rightOuter.y, color.white, 2, 2);
      });
      drawText("C08", (8 + load * 18).toPrecision(3), cx, cy - 20, 26, stroke, 3, "DYNAMIC");

    function drawBottomHud() {
      drawHudBalanceFrame();
      drawCentralLegInstrument();
      drawSwitchDeck();
    }

    function commandBounds(cmd) {
      const pad = Math.max(4, cmd.width + 2);
      const args = cmd.args;
      if (cmd.type === "Line") {
        const x = Math.min(args.x1, args.x2) - pad;
        const y = Math.min(args.y1, args.y2) - pad;
        return { x, y, w: Math.abs(args.x2 - args.x1) + pad * 2, h: Math.abs(args.y2 - args.y1) + pad * 2 };
      }
      if (cmd.type === "Circle") {
        const r = args.r + pad;
        return { x: args.x - r, y: args.y - r, w: r * 2, h: r * 2 };
      }
      if (cmd.type === "Arc") {
        let end = args.endDeg;
        while (end < args.startDeg) end += 360;
        const span = end - args.startDeg;
        const steps = Math.max(8, Math.ceil(span / 4));
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        for (let i = 0; i <= steps; i++) {
          const point = ellipsePoint(args.x, args.y, args.rx, args.ry, args.startDeg + (span * i) / steps);
          minX = Math.min(minX, point.x - pad);
          minY = Math.min(minY, point.y - pad);
          maxX = Math.max(maxX, point.x + pad);
          maxY = Math.max(maxY, point.y + pad);
        }
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
      }
      if (cmd.type === "Text") {
        const size = args.size || 16;
        const w = String(args.value).length * size * 0.62;
        return { x: args.x - w / 2 - pad, y: args.y - size / 2 - pad, w: w + pad * 2, h: size + pad * 2 };
      }
      return null;
    }

    function placementSafe() {
      return !commands.some((cmd) => {
        const bounds = commandBounds(cmd);
        return bounds && clientMaskRects.some((rect) => intersects(bounds, rect));
      });
    }

    function drawCommandList() {
      commandList.innerHTML = "";
      const title = document.createElement("h2");
      title.textContent = "Primitive Groups";
      commandList.appendChild(title);

      [
        ["FRAME", commands.filter((cmd) => cmd.name.startsWith("F")).length],
        ["LEG", commands.filter((cmd) => cmd.name.startsWith("CG") || cmd.name.startsWith("CL") || cmd.name.startsWith("CR")).length],
        ["SWITCH", commands.filter((cmd) => cmd.name.startsWith("SW")).length],
        ["STATIC", commands.filter((cmd) => cmd.scope === "STATIC").length],
        ["DYNAMIC", commands.filter((cmd) => cmd.scope === "DYNAMIC").length],
      ].forEach(([name, count]) => {
        const row = document.createElement("div");
        row.className = "command";
        row.innerHTML = `<code>${name}</code><span>bottom HUD layer</span><span>${count}</span>`;
        commandList.appendChild(row);
      });
    }

    function draw() {
      commands = [];
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#060709";
      ctx.fillRect(0, 0, W, H);
      drawGrid();
      drawForbiddenPreview();
      drawBottomHud();
      drawCommandList();

      const safe = placementSafe();
      referenceStatus.textContent = `${safe ? "SAFE" : "CHECK"} / 24+25`;
      referenceStatus.style.color = safe ? "var(--green)" : "var(--pink)";
      primitiveStatus.textContent = `${commands.length} total`;
    }

    function applyPreset(name) {
      preset = name;
      const next = {
        legacy: [true, false, false, false],
        fusion: [true, false, true, false],
        combat: [true, true, true, true],
      }[name] ?? [true, false, true, false];
      capSwitch.checked = Boolean(next[0]);
      turboSwitch.checked = Boolean(next[1]);
      feederSwitch.checked = Boolean(next[2]);
      spinSwitch.checked = Boolean(next[3]);
      document.querySelectorAll("[data-preset]").forEach((button) => {
        button.classList.toggle("active", button.dataset.preset === preset);
      });
      draw();
    }

    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => applyPreset(button.dataset.preset));
    });
    [capSwitch, turboSwitch, feederSwitch, spinSwitch, gridMode, maskToggle].forEach((control) => {
      control.addEventListener("input", draw);
      control.addEventListener("change", draw);
    });

    applyPreset(preset);
    function animate(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
      lastFrameTime = timestamp;
      legWidget.phase += dt * ((Math.PI * 2) / 3.2);
      draw();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
